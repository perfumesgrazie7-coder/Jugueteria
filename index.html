<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Juguetería Cloud</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#f5f7fb;color:#111827}button,input,select{font:inherit}button{border:0;border-radius:11px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}.app{max-width:1100px;margin:auto;min-height:100vh}.top{background:#111827;color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{font-size:18px;margin:0}.top small{opacity:.7}.user{font-size:11px;opacity:.75}main{padding:16px 14px 88px}.view{display:none}.view.active{display:block}.grid{display:grid;gap:12px}.cards{grid-template-columns:repeat(2,1fr)}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:15px}.label{font-size:12px;color:#6b7280}.value{font-size:22px;font-weight:800;margin-top:4px}.section{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 10px}.section h2{font-size:17px;margin:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px;background:#fff}.toolbar>*{flex:1;min-width:140px}.tablewrap{overflow:auto;background:#fff;border:1px solid #e5e7eb;border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:10px;border-bottom:1px solid #eef0f3;text-align:left;font-size:13px}.table th{font-size:11px;color:#6b7280;text-transform:uppercase}.badge{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.ok{background:#dcfce7;color:#166534}.low{background:#fef3c7;color:#92400e}.out{background:#fee2e2;color:#991b1b}.muted{color:#6b7280}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(6,1fr);z-index:10}.nav button{background:#fff;color:#6b7280;border-radius:0;padding:8px 2px;font-size:11px}.nav button.active{background:#111827;color:#fff}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{background:#fff;width:min(650px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.sheethead{display:flex;justify-content:space-between;align-items:center}.form{display:grid;gap:11px}.cols2{grid-template-columns:repeat(2,1fr)}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(420px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:22px}.loginbox h1{margin-top:0}.msg{padding:10px;border-radius:10px;margin-bottom:10px;background:#f3f4f6}.success{background:#dcfce7;color:#166534}.error{background:#fee2e2;color:#991b1b}.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}.nav{position:static;margin:0 14px;border:0}.modal{align-items:center}.sheet{border-radius:18px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox"><h1>Juguetería</h1><p class="muted">Gestión del negocio</p><div id="loginMsg"></div><form class="form" onsubmit="login(event)"><div><label>Correo</label><input id="email" type="email" required></div><div><label>Contraseña</label><input id="password" type="password" required></div><button class="primary">Ingresar</button></form></div></div>
<div id="app" class="app" style="display:none"><header class="top"><div><h1>Juguetería · Cloud</h1><small id="businessName">Cargando...</small></div><div><div id="userEmail" class="user"></div><button class="secondary" onclick="logout()">Salir</button></div></header>
<main>
<section id="dashboard" class="view active"><div class="section"><h2>Resumen</h2><button class="primary" onclick="openSale()">+ Venta</button></div><div class="grid cards" id="cards"></div><div class="section"><h2>Alertas de inventario</h2></div><div class="card" id="alerts"></div></section>
<section id="products" class="view"><div class="section"><h2>Productos</h2><button class="primary" onclick="openProduct()">+ Producto</button></div><div class="toolbar"><input id="productSearch" placeholder="Buscar..." oninput="renderProducts()"></div><div class="tablewrap"><table class="table"><thead><tr><th>Producto</th><th>Stock</th><th>Costo prom.</th><th>Precio</th><th>Margen</th><th></th></tr></thead><tbody id="productsBody"></tbody></table></div></section>
<section id="sales" class="view"><div class="section"><h2>Ventas</h2><button class="primary" onclick="openSale()">+ Venta</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Fecha</th><th>Total</th><th>Pago</th><th>Estado</th><th></th></tr></thead><tbody id="salesBody"></tbody></table></div></section>
<section id="purchases" class="view"><div class="section"><h2>Compras</h2><button class="primary" onclick="openPurchase()">+ Compra</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Fecha</th><th>Total</th><th></th></tr></thead><tbody id="purchasesBody"></tbody></table></div></section>
<section id="expenses" class="view"><div class="section"><h2>Gastos</h2><button class="primary" onclick="openExpense()">+ Gasto</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Fecha</th><th>Categoría</th><th>Descripción</th><th>Monto</th></tr></thead><tbody id="expensesBody"></tbody></table></div></section>
<section id="reports" class="view"><div class="section"><h2>Reportes</h2></div><div class="grid cards" id="reportCards"></div></section>
</main><nav class="nav"><button data-v="dashboard" onclick="show('dashboard')">⌂<br>Inicio</button><button data-v="products" onclick="show('products')">▣<br>Productos</button><button data-v="sales" onclick="show('sales')">＋<br>Ventas</button><button data-v="purchases" onclick="show('purchases')">↓<br>Compras</button><button data-v="expenses" onclick="show('expenses')">$<br>Gastos</button><button data-v="reports" onclick="show('reports')">▤<br>Reportes</button></nav></div>
<div id="modal" class="modal"><div class="sheet"><div class="sheethead"><h2 id="modalTitle"></h2><button class="secondary" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
const SUPABASE_URL='https://hgzhzbolvkernawjisd.supabase.co';
const SUPABASE_KEY='sb_publishable_4qIJ8RtepWrU7FkV0toU7w_DDpVwEUn';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let profile=null,businessId=null,products=[],categories=[],sales=[],purchases=[],expenses=[];
const money=n=>new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0}).format(Math.round(n||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function msg(id,text,kind='msg'){document.getElementById(id).innerHTML=text?`<div class="${kind}">${esc(text)}</div>`:''}
function show(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===id));loadAll()}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}
async function login(e){e.preventDefault();msg('loginMsg','');const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)return msg('loginMsg',error.message,'error');await boot()}
async function logout(){await sb.auth.signOut();location.reload()}
async function boot(){const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data:p,error}=await sb.from('profiles').select('id,full_name,role,active,business_id,businesses(name)').eq('id',user.id).single();if(error||!p||!p.active){return msg('loginMsg','No se pudo cargar el perfil.','error')}profile=p;businessId=p.business_id;document.getElementById('businessName').textContent=p.businesses?.name||'Juguetería';document.getElementById('userEmail').textContent=user.email;document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';await loadAll()}
async function loadAll(){if(!businessId)return;const [pr,ca,sa,pu,ex]=await Promise.all([sb.from('products').select('*').eq('business_id',businessId).eq('active',true).order('name'),sb.from('categories').select('*').eq('business_id',businessId).eq('active',true).order('name'),sb.from('sales').select('*').eq('business_id',businessId).order('sale_date',{ascending:false}).limit(100),sb.from('purchases').select('*').eq('business_id',businessId).order('purchase_date',{ascending:false}).limit(100),sb.from('expenses').select('*').eq('business_id',businessId).order('expense_date',{ascending:false}).limit(100)]);products=pr.data||[];categories=ca.data||[];sales=sa.data||[];purchases=pu.data||[];expenses=ex.data||[];render()}
function render(){const today=new Date();today.setHours(0,0,0,0);const ts=sales.filter(s=>s.status==='completed'&&new Date(s.sale_date)>=today);const todaySales=ts.reduce((a,s)=>a+Number(s.total),0);const stock=products.reduce((a,p)=>a+Number(p.stock),0);const inv=products.reduce((a,p)=>a+Number(p.stock)*Number(p.average_cost),0);const low=products.filter(p=>Number(p.stock)<=Number(p.minimum_stock));document.getElementById('cards').innerHTML=[['Ventas hoy',money(todaySales)],['Ventas',ts.length],['Unidades',stock],['Valor inventario',money(inv)]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('');document.getElementById('alerts').innerHTML=low.length?low.map(p=>`<div class="line"><span>${esc(p.name)}</span><span class="badge ${Number(p.stock)<=0?'out':'low'}">${Number(p.stock)<=0?'AGOTADO':'Bajo'} · ${p.stock}</span></div>`).join(''):'<div class="muted">Sin alertas.</div>';renderProducts();renderSales();renderPurchases();renderExpenses();renderReports()}
function renderProducts(){const q=(document.getElementById('productSearch')?.value||'').toLowerCase();document.getElementById('productsBody').innerHTML=products.filter(p=>p.name.toLowerCase().includes(q)).map(p=>{const m=Number(p.sale_price)?((Number(p.sale_price)-Number(p.average_cost))/Number(p.sale_price))*100:0;return `<tr><td>${esc(p.name)}</td><td>${p.stock}</td><td>${money(p.average_cost)}</td><td>${money(p.sale_price)}</td><td>${m.toFixed(1)}%</td><td><button class="secondary" onclick="openProduct('${p.id}')">Editar</button></td></tr>`}).join('')||'<tr><td colspan="6" class="muted">No hay productos.</td></tr>'}
function renderSales(){document.getElementById('salesBody').innerHTML=sales.map(s=>`<tr><td>${new Date(s.sale_date).toLocaleString('es-CL')}</td><td>${money(s.total)}</td><td>${esc(s.payment_method)}</td><td>${s.status==='completed'?'<span class="badge ok">Completada</span>':'<span class="badge out">Anulada</span>'}</td><td>${s.status==='completed'&&profile.role==='admin'?`<button class="danger" onclick="cancelSale('${s.id}')">Anular</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No hay ventas.</td></tr>'}
function renderPurchases(){document.getElementById('purchasesBody').innerHTML=purchases.map(p=>`<tr><td>${new Date(p.purchase_date).toLocaleString('es-CL')}</td><td>${money(p.total)}</td><td>${esc(p.notes||'')}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">No hay compras.</td></tr>'}
function renderExpenses(){document.getElementById('expensesBody').innerHTML=expenses.map(e=>`<tr><td>${new Date(e.expense_date).toLocaleDateString('es-CL')}</td><td>${esc(e.category)}</td><td>${esc(e.description||'')}</td><td>${money(e.amount)}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No hay gastos.</td></tr>'}
function renderReports(){const total=sales.filter(s=>s.status==='completed').reduce((a,s)=>a+Number(s.total),0);const gastos=expenses.reduce((a,e)=>a+Number(e.amount),0);const inv=products.reduce((a,p)=>a+Number(p.stock)*Number(p.average_cost),0);document.getElementById('reportCards').innerHTML=[['Ventas registradas',money(total)],['Gastos',money(gastos)],['Valor inventario',money(inv)],['Productos',products.length]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}
function openProduct(id=null){if(profile.role!=='admin')return alert('Solo administrador');const p=id?products.find(x=>x.id===id):null;openModal(p?'Editar producto':'Nuevo producto',`<form class="form" onsubmit="saveProduct(event,'${id||''}')"><div><label>Nombre</label><input id="pn" required value="${esc(p?.name||'')}"></div><div class="grid cols2"><div><label>Categoría</label><select id="pc"><option value="">Sin categoría</option>${categories.map(c=>`<option value="${c.id}" ${p?.category_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div><label>Stock mínimo</label><input id="pm" type="number" min="0" value="${p?.minimum_stock??0}"></div></div><div class="grid cols2"><div><label>Costo inicial</label><input id="pcost" type="number" min="0" step="1" value="${p?.average_cost??0}" ${p?'disabled':''}></div><div><label>Precio de venta</label><input id="pp" type="number" min="0" step="1" value="${p?.sale_price??0}"></div></div><div><label>Stock inicial</label><input id="ps" type="number" min="0" step="1" value="${p?.stock??0}" ${p?'disabled':''}></div><button class="primary">Guardar</button></form>`)}
async function saveProduct(e,id){e.preventDefault();const payload={name:pn.value,category_id:pc.value||null,minimum_stock:Number(pm.value||0),sale_price:Number(pp.value||0)};if(!id){payload.business_id=businessId;payload.purchase_cost=Number(pcost.value||0);payload.average_cost=Number(pcost.value||0);payload.stock=Number(ps.value||0)}let q=id?sb.from('products').update(payload).eq('id',id).eq('business_id',businessId):sb.from('products').insert(payload);const {error}=await q;if(error)return alert(error.message);closeModal();await loadAll()}
function openSale(){if(!products.length)return alert('Primero crea al menos un producto.');openModal('Nueva venta',`<form class="form" onsubmit="saveSale(event)"><div id="saleLines"></div><button type="button" class="secondary" onclick="addSaleLine()">+ Producto</button><div><label>Descuento</label><input id="sd" type="number" min="0" value="0"></div><div><label>Pago</label><select id="sp"><option value="cash">Efectivo</option><option value="card">Tarjeta</option><option value="transfer">Transferencia</option></select></div><button class="primary">Registrar venta</button></form>`);addSaleLine()}
function addSaleLine(){const box=document.getElementById('saleLines');const row=document.createElement('div');row.className='grid cols2';row.style.marginBottom='8px';row.innerHTML=`<select class="slp">${products.map(p=>`<option value="${p.id}">${esc(p.name)} · stock ${p.stock} · ${money(p.sale_price)}</option>`).join('')}</select><input class="slq" type="number" min="1" value="1" placeholder="Cantidad">`;box.appendChild(row)}
async function saveSale(e){e.preventDefault();const rows=[...document.querySelectorAll('#saleLines>div')];const items=rows.map(r=>({product_id:r.querySelector('.slp').value,quantity:Number(r.querySelector('.slq').value),unit_price:Number(products.find(p=>p.id===r.querySelector('.slp').value).sale_price)}));const {data,error}=await sb.rpc('create_sale',{p_payment_method:sp.value,p_items:items,p_discount:Number(sd.value||0),p_sale_date:new Date().toISOString(),p_notes:null});if(error)return alert(error.message);closeModal();await loadAll();show('sales')}
function openPurchase(){if(profile.role!=='admin')return alert('Solo administrador');openModal('Nueva compra',`<form class="form" onsubmit="savePurchase(event)"><div id="purchaseLines"></div><button type="button" class="secondary" onclick="addPurchaseLine()">+ Producto</button><div><label>Notas</label><input id="pnotes"></div><button class="primary">Registrar compra</button></form>`);addPurchaseLine()}
function addPurchaseLine(){const box=document.getElementById('purchaseLines');const row=document.createElement('div');row.className='grid cols2';row.style.marginBottom='8px';row.innerHTML=`<select class="plp">${products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><div class="grid cols2"><input class="plq" type="number" min="1" value="1" placeholder="Cantidad"><input class="plc" type="number" min="0" value="0" placeholder="Costo unit."></div>`;box.appendChild(row)}
async function savePurchase(e){e.preventDefault();const rows=[...document.querySelectorAll('#purchaseLines>div')];const items=rows.map(r=>({product_id:r.querySelector('.plp').value,quantity:Number(r.querySelector('.plq').value),unit_cost:Number(r.querySelector('.plc').value)}));const {data,error}=await sb.rpc('create_purchase',{p_supplier_id:null,p_purchase_date:new Date().toISOString(),p_notes:pnotes.value||null,p_items:items});if(error)return alert(error.message);closeModal();await loadAll();show('purchases')}
function openExpense(){openModal('Nuevo gasto',`<form class="form" onsubmit="saveExpense(event)"><div><label>Categoría</label><input id="ec" required placeholder="Transporte, comida, etc."></div><div><label>Descripción</label><input id="ed"></div><div><label>Monto</label><input id="ea" type="number" min="0" required></div><button class="primary">Guardar gasto</button></form>`)}
async function saveExpense(e){e.preventDefault();const {error}=await sb.from('expenses').insert({business_id:businessId,category:ec.value,description:ed.value||null,amount:Number(ea.value),expense_date:new Date().toISOString()});if(error)return alert(error.message);closeModal();await loadAll()}
async function cancelSale(id){if(!confirm('¿Anular esta venta? El stock será repuesto.'))return;const {error}=await sb.rpc('cancel_sale',{p_sale_id:id});if(error)return alert(error.message);await loadAll()}
sb.auth.getSession().then(({data:{session}})=>{if(session)boot()});
</script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{})}</script></body></html>
